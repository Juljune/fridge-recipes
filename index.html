<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge Magnet Recipes</title>
  <meta name="description" content="Add what's in your fridge and find recipes you can cook with it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bagel+Fat+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="door">
    <div class="door-inner">
      <h1>What's in your fridge?</h1>
      <p class="intro">Add what you have, then find recipes that use it.</p>

      <form id="ingredient-form" class="add-form">
        <label for="ingredient-input">Ingredient</label>
        <div class="add-row">
          <input id="ingredient-input" list="ingredient-options" autocomplete="off" placeholder="Chicken, eggs, spinach...">
          <datalist id="ingredient-options"></datalist>
          <button type="submit" class="button-secondary">Add</button>
        </div>
      </form>

      <ul id="magnets" class="magnets" aria-label="Ingredients in your fridge"></ul>

      <div id="suggestions" class="suggestions">
        <span>Try:</span>
        <button type="button" data-ingredient="Chicken">Chicken</button>
        <button type="button" data-ingredient="Eggs">Eggs</button>
        <button type="button" data-ingredient="Rice">Rice</button>
        <button type="button" data-ingredient="Tomato">Tomato</button>
      </div>

      <button id="find-button" class="button-primary" type="button">Find recipes</button>
    </div>
  </header>

  <main>
    <p id="status" class="status" role="status"></p>
    <section id="results" class="results" aria-label="Recipes"></section>
  </main>

  <dialog id="recipe-dialog" class="recipe-dialog" aria-labelledby="recipe-title">
    <div id="recipe-content"></div>
  </dialog>

  <footer>
    Recipes and photos from <a href="https://www.themealdb.com/">TheMealDB</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
